{% load static %}
<!DOCTYPE html>
<html class="light" lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        {% block meta %} {% endblock meta %}
        <link href="https://fonts.googleapis.com" rel="preconnect">
        <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
        <script>
            window.tailwind = {
                config: {
                    darkMode: "class",
                    theme: {
                        extend: {
                            colors: {
                                "on-secondary": "#ffffff",
                                "on-background": "#191c1e",
                                "on-secondary-fixed": "#261900",
                                "tertiary-container": "#0b1c30",
                                "on-surface-variant": "#45464d",
                                "secondary-container": "#fed488",
                                "surface": "#f7f9fb",
                                "secondary": "#775a19",
                                "on-primary-container": "#7c839b",
                                "inverse-surface": "#2d3133",
                                "on-tertiary-container": "#75859d",
                                "tertiary-fixed-dim": "#b7c8e1",
                                "outline": "#76777d",
                                "on-error-container": "#93000a",
                                "error": "#ba1a1a",
                                "on-tertiary-fixed-variant": "#38485d",
                                "secondary-fixed-dim": "#e9c176",
                                "on-primary-fixed": "#131b2e",
                                "tertiary": "#000000",
                                "on-error": "#ffffff",
                                "tertiary-fixed": "#d3e4fe",
                                "secondary-fixed": "#ffdea5",
                                "surface-container-high": "#e6e8ea",
                                "surface-container-low": "#f2f4f6",
                                "inverse-primary": "#bec6e0",
                                "primary-fixed-dim": "#bec6e0",
                                "surface-variant": "#e0e3e5",
                                "surface-bright": "#f7f9fb",
                                "surface-container-lowest": "#ffffff",
                                "primary-container": "#131b2e",
                                "outline-variant": "#c6c6cd",
                                "surface-dim": "#d8dadc",
                                "on-primary-fixed-variant": "#3f465c",
                                "on-tertiary": "#ffffff",
                                "inverse-on-surface": "#eff1f3",
                                "on-secondary-fixed-variant": "#5d4201",
                                "error-container": "#ffdad6",
                                "primary": "#000000",
                                "surface-tint": "#565e74",
                                "surface-container-highest": "#e0e3e5",
                                "on-secondary-container": "#785a1a",
                                "on-primary": "#ffffff",
                                "surface-container": "#eceef0",
                                "primary-fixed": "#dae2fd",
                                "background": "#f7f9fb",
                                "on-tertiary-fixed": "#0b1c30",
                                "on-surface": "#191c1e"
                            },
                            borderRadius: {
                                "DEFAULT": "0.125rem",
                                "lg": "0.25rem",
                                "xl": "0.5rem",
                                "full": "0.75rem"
                            },
                            spacing: {
                                "gutter": "24px",
                                "xs": "4px",
                                "md": "24px",
                                "xl": "64px",
                                "base": "8px",
                                "lg": "40px",
                                "sm": "12px",
                                "container-max": "1440px"
                            },
                            fontFamily: {
                                "headline": ["Manrope", "sans-serif"],
                                "body": ["Inter", "sans-serif"],
                                "label": ["Inter", "sans-serif"],
                                "body-sm": ["Inter", "sans-serif"],
                                "h3": ["Manrope", "sans-serif"],
                                "label-caps": ["Inter", "sans-serif"],
                                "h1": ["Manrope", "sans-serif"],
                                "body-md": ["Inter", "sans-serif"],
                                "h2": ["Manrope", "sans-serif"],
                                "data-tabular": ["Inter", "sans-serif"],
                                "body-lg": ["Inter", "sans-serif"]
                            },
                            fontSize: {
                                "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                                "h3": ["24px", { "lineHeight": "1.2", "fontWeight": "700" }],
                                "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }],
                                "h1": ["40px", { "lineHeight": "1.1", "fontWeight": "800" }],
                                "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                                "h2": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
                                "data-tabular": ["14px", { "lineHeight": "1", "fontWeight": "500" }],
                                "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }]
                            }
                        }
                    }
                }
            }
        </script>
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <style>
            body {
                font-family: "Inter", sans-serif;
                background: #f7f9fb;
                color: #191c1e;
            }

            h1, h2, h3, h4, h5, h6, .font-headline {
                font-family: "Manrope", sans-serif;
            }

            .material-symbols-outlined {
                font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
            }
        </style>
    </head>

    <body class="bg-surface text-on-surface antialiased">
        {% block content %} {% endblock content %}
    </body>
</html>
